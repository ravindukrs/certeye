name: Build Agent
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        cd certeye-agent
        docker build . --file Dockerfile --tag certeye-agent:${{github.run_number}}
    - name: List Docker Images & Inspect
      run: |
        docker images
    - name: Docker Push
      run: |
        docker images

  docker-image-list:

    runs-on: ubuntu-latest

    steps:
    - name: List Docker Images
      run: |
        ls
        docker images
    - name: Docker Inspect
      run: |
        docker image inspect certeye-agent:${{github.run_number}}
